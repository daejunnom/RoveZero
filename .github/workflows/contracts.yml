name: Workspace CPU

on:
  push:
    branches: [develop]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'benches/runtime/**', 'experiments/model-research/**', 'experiments/bindings-research/**', '.github/workflows/contracts.yml']
  pull_request:
    branches: [develop]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'benches/runtime/**', 'experiments/model-research/**', 'experiments/bindings-research/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  bindings-cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/bindings-target
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.3'
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Build and check isolated research facade
        working-directory: experiments/bindings-research
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/RoveZero/bindings-venv"
          source "$RUNNER_TEMP/RoveZero/bindings-venv/bin/activate"
          python -m pip install maturin==1.15.0
          cargo fmt --all -- --check
          cargo test --locked -p rz-bindings-core
          cargo build --release --locked -p rz-bindings-core
          python -m maturin develop --release --locked
          RZ_BINDINGS_CLI="$CARGO_TARGET_DIR/release/rz-bindings-core" python check_paths.py -q
          cargo clippy --all-targets --locked -- -D warnings
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --all-features --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/workspace-target
      - run: cargo test -p rz-uci --test native_cli --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/workspace-target
      - run: python -m pip install python-chess==1.999 chess==1.11.2
      - run: cargo test --release -p rz-position --all-features --locked -- --include-ignored
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/workspace-target
          RZ_CHESS_PYTHON: python
      - run: python -m unittest discover -s experiments/model-research/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/experiments/model-research/src
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python -m unittest discover -s benches/runtime/tests -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/workspace-target
