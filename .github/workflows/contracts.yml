name: Workspace CPU

on:
  push:
    branches: [develop]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'experiments/model-research/**', '.github/workflows/contracts.yml']
  pull_request:
    branches: [develop]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**', 'experiments/model-research/**', '.github/workflows/contracts.yml']

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/workspace-target
      - run: python -m pip install python-chess==1.999 chess==1.11.2
      - run: cargo test --release -p rz-position --all-features --locked -- --include-ignored
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/workspace-target
          RZ_CHESS_PYTHON: python
      - run: python -m unittest discover -s experiments/model-research/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/experiments/model-research/src
          PYTHONDONTWRITEBYTECODE: '1'
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/RoveZero/workspace-target
