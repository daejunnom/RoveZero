[package]
name = "rz-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "RoveZero model evaluation and deterministic backend test support"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rz-encoding = { path = "../rz-encoding" }
sha2 = "=0.10.9"
flate2 = "=1.1.2"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic", "cuda"], optional = true }
rz-contracts = { git = "https://github.com/daejunnom/RoveZero.git", rev = "18339c30754f4f38d957d96aeab481b018b98718", optional = true }

[features]
default = []
onnx = ["dep:ort"]
contracts = ["dep:rz-contracts"]

[[example]]
name = "maia_check"
required-features = ["onnx"]
