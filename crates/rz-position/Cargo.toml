[package]
name = "rz-position"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "RoveZero's independent standard-chess rules and immutable position snapshots"

[lib]
path = "src/lib.rs"

[features]
default = []
contracts = ["dep:rz-contracts", "dep:sha2"]
# Opt-in experiments; the existing owned claim preview remains the default.
experimental-claim-preview = []
# Preserve the digest codec; borrow history and memoize only this live owner.
experimental-history-digest = ["contracts"]

[dependencies]
rz-contracts = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
