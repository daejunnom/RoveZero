[package]
name = "rz-experiments"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "RoveZero E01 input manifests, validation and artifact identity"

# I01 owns registration in the final root workspace.
[workspace]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"
