[package]
name = "rz-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded, single-owner evaluation scheduling for RoveZero"

# Temporary isolated build until TASK-I01 publishes the root workspace.
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
rz-telemetry = { path = "../rz-telemetry" }
rz-contracts = { git = "https://github.com/daejunnom/RoveZero", rev = "67284c4f66f7a7ae9f46fa63dfd50e7410eb6845", optional = true }

[features]
default = []
contracts = ["dep:rz-contracts"]
