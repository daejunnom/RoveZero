[package]
name = "rz-arena"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "RoveZero paired opening plans and attempt/failure ledger"

# Independent E development until I01 registers the crate in the root workspace.
[workspace]

[dependencies]
rz-experiments = { path = "../rz-experiments" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.177"
