[package]
name = "rz-arena"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "RoveZero paired opening plans and attempt/failure ledger"

[features]
test-fixtures = []
experimental-snapshot-io = []
experimental-snapshot-reclaim = []
pals-collection = ["dep:rz-uci"]
native-cuda = ["dep:rz-uci", "rz-uci/onnx-cuda"]
native-cuda-batch = ["native-cuda", "rz-uci/experimental-batch", "rz-eval/experimental-batch"]

[[bin]]
name = "rz-arena-fixture-engine"
path = "src/bin/fixture-engine.rs"
required-features = ["test-fixtures"]

[[example]]
name = "pilot_failure_audit"
required-features = ["native-cuda"]

[[example]]
name = "native_batch_prepare"
required-features = ["native-cuda-batch"]

[[example]]
name = "pals_collect"
required-features = ["pals-collection"]

[dependencies]
rz-experiments.workspace = true
rz-contracts.workspace = true
rz-eval.workspace = true
rz-search.workspace = true
rz-position = { workspace = true, features = ["contracts"] }
rz-uci = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix.workspace = true
